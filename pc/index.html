<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멀티뷰 PC 설치</title>
<link rel="icon" href="../icon-256.png">
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e7e9ee; --dim:#9aa1ad; --accent:#4f8cff; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 "Segoe UI","Malgun Gothic",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 20px; }
  h1 { display:flex; align-items:center; gap:12px; font-size:26px; margin:0 0 6px; }
  h1 img { width:44px; height:44px; }
  .sub { color:var(--dim); margin:0 0 24px; }
  a.btn { display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none; font-size:19px; font-weight:600; padding:16px; border-radius:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-top:20px; }
  ol { margin:8px 0 0; padding-left:22px; } li { margin:6px 0; }
  .dim { color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1><img src="../icon-256.png" alt=""> 멀티뷰 PC 설치</h1>
  <p class="sub">Windows PC용 · 버전 <b>1.1.4</b></p>
  <a class="btn" href="MultiView-Setup.exe" download>⬇ 설치 파일 받기 (83MB)</a>
  <div class="card">
    <b>설치 방법</b>
    <ol>
      <li>받은 <b>MultiView-Setup.exe</b>를 실행하세요. (이미 설치돼 있으면 덮어써지고, ID·비밀번호·설정은 그대로예요)</li>
      <li>"Windows의 PC 보호" 창이 뜨면 <b>추가 정보 → 실행</b>을 누르세요.</li>
      <li>처음 한 번 관리자 권한 확인 창이 뜨면 <b>예</b>를 누르세요.</li>
      <li>첫 화면에서 <b>윈도우 시작 시 자동 실행</b>을 켜 두세요.</li>
    </ol>
  </div>
  <p class="dim" style="margin-top:20px">휴대폰에서 PC를 보려면 → <a href="../" style="color:var(--accent)">멀티뷰 모바일</a></p>
</main>
</body>
</html>
